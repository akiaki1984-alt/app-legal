<h1>Creatine Tank「いま、どれくらい満ちている？」</h1>
<p>毎日クレアチンを飲んでいても、いま自分がどれくらい満ちているのかは分かりません。Creatine Tank は、記録した摂取量・体重・食生活・経過日数から<strong>推定飽和レベル</strong>を計算し、それをタンクとして見せる iPhone / Apple Watch アプリです。1〜2タップで記録でき、1日飲み忘れても急には下がりません。</p>
<p>記録も設定もすべて端末の中に保存され、外部のサーバーへ送られることはありません。</p>
