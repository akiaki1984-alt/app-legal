<h1>Vitamin C Flow「飲んだビタミンCは、いまどこにいる？」</h1>
<p>ビタミンCは、飲んだ量がそのまま体に入るわけではありません。1回にたくさん摂るほど吸収される割合は下がり、使いきれない分は尿として出ていきます。Vitamin C Flow は「何mg飲んだか」ではなく、そのビタミンCがいま体の中でどうなっているか（吸収中・血中供給中・利用中・余剰排泄傾向）を、タップだけの記録から見せる iPhone / Apple Watch アプリです。</p>
<p>記録も設定もすべて端末の中に保存され、外部のサーバーへ送られることはありません。</p>
